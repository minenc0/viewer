<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Upload PDF</title>
</head>
<body>

<h2>Upload PDF</h2>

<input type="file" id="file" accept=".pdf">
<button onclick="upload()">Upload</button>

<br><br>

<div id="result"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {

  apiKey: "ISI_APIKEY",

  authDomain: "ISI_AUTHDOMAIN",

  projectId: "ISI_PROJECTID",

  storageBucket: "ISI_STORAGEBUCKET"

};

const app = initializeApp(firebaseConfig);

const storage = getStorage(app);

window.upload = async function() {

  const file =
    document.getElementById("file").files[0];

  if(!file){
    alert("Pilih PDF dulu");
    return;
  }

  try {

    const fileRef = ref(
      storage,
      "pdf/" + Date.now() + "_" + file.name
    );

    await uploadBytes(fileRef,file);

    const pdfUrl =
      await getDownloadURL(fileRef);

    const viewerUrl =
      "https://minenc0.github.io/viewer/viewer/?file="
      + encodeURIComponent(pdfUrl);

    document.getElementById("result").innerHTML = `
      <b>Upload Berhasil</b><br><br>

      <a href="${viewerUrl}" target="_blank">
      Buka PDF
      </a>

      <br><br>

      <textarea rows="5" cols="80">${viewerUrl}</textarea>
    `;

  } catch(err){

    console.error(err);

    alert("Upload gagal");

  }

};

</script>

</body>
</html>
