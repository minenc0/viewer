<!DOCTYPE html>
<html>
<head>
  <title>Upload PDF System</title>
</head>
<body>

<h2>Upload PDF</h2>

<input type="file" id="file">
<button onclick="upload()">Upload</button>

<p id="result"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getStorage, ref, uploadBytes, getDownloadURL }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

// 🔥 GANTI INI DENGAN FIREBASE KAMU
const firebaseConfig = {
  apiKey: "XXX",
  authDomain: "XXX",
  projectId: "XXX",
  storageBucket: "XXX",
};

const app = initializeApp(firebaseConfig);
const storage = getStorage(app);

window.upload = async function () {

  const file = document.getElementById("file").files[0];

  if (!file) return alert("Pilih file dulu");

  const fileRef = ref(storage, "pdf/" + Date.now() + "_" + file.name);

  await uploadBytes(fileRef, file);

  const url = await getDownloadURL(fileRef);

  const viewerLink =
    window.location.origin + "/viewer/?file=" + encodeURIComponent(url);

  document.getElementById("result").innerHTML =
    "✅ Link Viewer:<br><a href='" + viewerLink + "' target='_blank'>" + viewerLink + "</a>";
}
</script>

</body>
</html>
